server:
  port: 8080
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB

spring:
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rag_assistant}"
    username: "${SPRING_DATASOURCE_USERNAME:rag_user}"
    password: "${SPRING_DATASOURCE_PASSWORD:rag_password}"
  jpa:
    hibernate:
      # "update" is fine for the stage; switch to a proper migration
      # tool (Flyway/Liquibase) before this ever sees production data.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  jwt:
    # NEVER commit a real secret. Override this via the JWT_SECRET env
    # var (see application-example below / .env in Docker Compose).
    secret: "${JWT_SECRET:change-this-to-a-long-random-secret-please}"
    expiration-ms: 86400000 # 24h
  ai-service:
    base-url: "${AI_SERVICE_URL:http://localhost:8000}"
